name: Validate HEPS draw ledger

on:
  push:
    paths:
      - 'data/draw_history.jsonl'
      - 'data/draw_manifest.json'
      - 'scripts/validate_draws.py'
      - 'scripts/sync_manifest.py'
      - 'scripts/append_draw.py'
      - 'scripts/simulate_null_model.py'
      - 'scripts/score_prediction.py'
      - 'scripts/portfolio_orchestration.py'
      - 'scripts/evaluate_expert_orchestration.py'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-draws.yml'
  pull_request:
    paths:
      - 'data/draw_history.jsonl'
      - 'data/draw_manifest.json'
      - 'scripts/validate_draws.py'
      - 'scripts/sync_manifest.py'
      - 'scripts/append_draw.py'
      - 'scripts/simulate_null_model.py'
      - 'scripts/score_prediction.py'
      - 'scripts/portfolio_orchestration.py'
      - 'scripts/evaluate_expert_orchestration.py'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-draws.yml'

jobs:
  validate-draws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate draw ledger
        run: python scripts/validate_draws.py data/draw_history.jsonl
      - name: Check draw manifest synchronization
        run: python scripts/sync_manifest.py --check
      - name: Smoke test randomized null-model baseline
        run: python scripts/simulate_null_model.py --trials 1000 --seed 20260704 > /tmp/heps-null-baseline.json
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
