experiment_id: E0037
title: Information Ceiling and Anytime-Valid Prequential Gate
opened: 2026-10-14
author_model: claude-opus-5-5
status: preregistration
evidence_classification_sought: [INSUFFICIENT_EVIDENCE, PROVISIONAL_SIGNAL]
architecture_status: experimental
paper_trading_only: true
governing_hypothesis_file: experiments/E0037/hypothesis.md
implementation: scripts/e0037_prequential_gate.py
tests: tests/test_e0037_prequential_gate.py

authority:
  slate: none
  k13_membership: none
  line_ranking: none
  hard_pruning: none
  powerball_selection: none
  produces_prediction_slate: false

lanes:
  Main: {ledger: data/draw_history.jsonl, fitted_independently: true}
  XTRA: {ledger: data/powerball_xtra_history.jsonl, fitted_independently: true,
         provenance_caveat: "18 rows pending official-source verification"}

data:
  start: 2026-06-02
  retrospective_cutoff: 2026-10-13
  rows_per_lane: 39
  targets: "rows 7..39 (33 per lane)"
  subwindows:
    e0036_retrospective: "rows 7..34 (2026-06-23..2026-09-25), 28 targets"
    e0036_zero_credit: "row 35 (2026-09-29)"
    e0036_post_freeze_spec_determined: "rows 36..39 (2026-10-02..2026-10-13); implementation written after outcomes"
  sensitivity: "Main targets excluding draw_id 30,31 (electronic_rng)"

part_a_information_ceiling:
  event_ceiling: "kl(P(A)||U(A)) <= D"
  mean_hit_ceiling: "exponential tilt of hypergeometric H along H"
  sesoi_k13_lift_winners_per_draw: 0.13
  sesoi_D_nats_per_draw: 0.009388

part_b_forecasters:
  BB:   {law: fisher_noncentral_product_weight, estimator: one_step_ridge_from_zero,
         formula: "theta_i=(c_i-0.1n)/(0.0918367*n+1/tau^2)", tau: [0.05, 0.10, 0.20, 0.40]}
  BBEW: {law: fisher_noncentral_product_weight, estimator: one_step_ridge_exponential_counts,
         half_life_draws: 8, tau: 0.20}
  RP:   {law: "exp(rho*|x cap prev|)", prior: "N(0,0.5^2)", estimator: exact_MAP_newton,
         disclosure: "Main motivated in part by 2026-10-14 overlap audit (z=-1.26); exploratory for Main"}
  TRANS: {models: [M1, M2a, M2b], spec: "experiments/E0036/hypothesis.md sections 3 and 6 (frozen 2026-10-02)"}
  composite_weights:
    BB: "1/16 each (class 1/4)"
    BBEW: "1/4"
    RP: "1/4"
    TRANS: "1/12 each (class 1/4)"
  powerball: {law: dirichlet_multinomial_prequential, a: [1, 4, 16, 64], weights: equal}
  comparators_not_gated: [E0030_incumbent_mixture, E0030_cumulative_frequency, E0030_recent5]

decision_rules:
  retrospective: "discovery only; max_t E_t >= 80 -> PROVISIONAL_SIGNAL label for prospective follow-up only"
  prospective_start: "first draw after commit of this protocol and frozen code (2026-10-16)"
  prospective_rejection: "lane E_t >= 80 at any time (familywise 0.05 over 4 lanes, Ville)"
  practical_significance: "leading forecaster prospective mean improvement > 0.009388 nats/draw"
  futility_review: "100 prospective targets per lane"
  forecaster_changes: "forbidden; new experiment ID and new e-process required"

falsification:
  F1: "zero-parameter forecaster != U beyond 1e-12 relative -> REJECT implementation"
  F2: "DP vs full enumeration disagreement > 1e-9 relative -> REJECT implementation"
  F3: "target-row perturbation changes its own forecast -> REJECT temporal integrity"
  F4: "simulated-null mean E or P(sup E>=20) inconsistent with martingale/Ville -> REJECT e-process implementation"
  F5: "M1 fails to reproduce E0032 Screen A within 0.002 nats/target -> reproduction discrepancy"
  F6: "E0033 construction calibrated under null (|mean pct-0.5|<=0.02 and Top10 4+ within MC error of random order) -> artifact hypothesis rejected"

part_d_power:
  alternatives_relative_inclusion_sd: [0.0, 0.02, 0.05, 0.10, 0.20]
  replicates: 200
  horizon: 1080
  seed_rule: "20261014 + 1000*idx_s + rep"
  checkpoints: [39, 100, 250, 500, 1080]

part_e:
