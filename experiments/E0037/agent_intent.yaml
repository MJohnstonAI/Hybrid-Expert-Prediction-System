  Every downstream HEPS metric is bounded by the per-draw KL divergence of the true
  draw law from uniform. The prequential likelihood ratio is simultaneously the
  proper-score gate and an anytime-valid test. If no coherent forecaster
  accumulates evidence, the K13/assembly programme cannot exceed chance by more
  than the ceiling implied by the plausible divergence.

