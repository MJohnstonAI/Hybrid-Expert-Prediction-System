experiment_id: E0036
title: Power/Identifiability Gate and Unary-Residual Adequacy Test
status: red_team_revised_preregistration_fresh_freeze_required
evidence_classification: INSUFFICIENT_EVIDENCE
paper_trading_only: true
lane: [Main, XTRA]
stage:
  - methodology
  - candidate_funnel

experiment_type: gate_not_feature_family

governing_hypothesis_file: experiments/E0036/hypothesis.md
preregistration_note: >
  The 2026-09-29 draft was red-team reviewed before implementation/replay and is
  superseded by this corrected protocol. Git history preserves the original.
  A fresh SHA-256 freeze is required before execution; any later model/metric change
  voids that freeze and requires a new amendment or experiment ID.

