schema_version: 1
updated: 2026-08-30
purpose: >-
  Independent expert-state registry for the South African PowerBall XTRA HEPS lane.
  Architecture families may mirror Main, but all fitted state, evidence, and outputs
  are XTRA-only and use data from 2026-06-02 onward.

architecture_stages:
  - data_integrity
  - slot_forecast
  - candidate_funnel
  - coalition_assembly
  - morphology
  - winner_float_ranking
  - portfolio_optimization
  - powerball_matrix

experts:
  - expert_id: XTRA_MACHINE_PROVENANCE_DIAGNOSTIC
    stage: data_integrity
    architecture_status: production
    evidence: BREAKTHROUGH
    authority:
      diagnostic: true
      may_score: false
      may_adjust_exposure: false
      may_hard_eliminate: false
    notes:
      - Breakthrough status is methodological/data-integrity necessity, not predictive superiority.
      - Backfill only from verifiable source records; unknown is valid.
      - Machine-conditioned prediction remains disabled unless machine identity/state is known before the target draw.
      - Post-draw-only machine identity may support heterogeneity and stationarity diagnostics only.

  - expert_id: XTRA_HLR_SLOT
    stage: slot_forecast
    architecture_status: experimental
    evidence: INSUFFICIENT_EVIDENCE
    authority:
      diagnostic: true
      may_score: true
      may_hard_eliminate: false

  - expert_id: XTRA_HLR_FULL_MIXTURE_BASE
    name: Full-Support HLR Residual Mixture Base
    stage: slot_forecast
    architecture_status: shadow
    evidence: INSUFFICIENT_EVIDENCE
    dependencies: [XTRA_HLR_SLOT]
    authority:
      diagnostic: true
      may_score: true
      may_adjust_exposure: false
      may_hard_eliminate: false
      may_add_candidates: false
      may_remove_candidates: false
    parameters:
      tau: 6.0
      pooling: geometric_mean_of_slot_HLR_residual_likelihood_ratios
    evidence_paths:
      - experiments/E0018/hypothesis.md
      - experiments/E0018/protocol.yaml
      - experiments/E0018/decision.md
      - scripts/xtra_full_mixture_base.py
    notes:
      - Enumerates all C(50,5) legal combinations and preserves positive probability for every legal combination.
      - Shrinks learned slot-HLR successor probabilities toward exact order-statistic HLR geometry.
      - A modal HLR vector may be reported but cannot hard-gate the candidate field.
      - First eligible target is 2026-09-01.

  - expert_id: XTRA_VVD_DELTA
    stage: candidate_funnel
    architecture_status: experimental
    evidence: INSUFFICIENT_EVIDENCE
    dependencies: [XTRA_HLR_SLOT]
    authority:
      diagnostic: true
      may_score: true
      may_hard_eliminate: false

  - expert_id: XTRA_STICTION_SHADOW
    stage: candidate_funnel
    architecture_status: shadow
    evidence: INSUFFICIENT_EVIDENCE
    authority:
      diagnostic: true
      may_score: true
      may_adjust_exposure: true
      may_hard_eliminate: false

  - expert_id: XTRA_VOID_BRIDGE
    stage: candidate_funnel
    architecture_status: shadow
    evidence: INSUFFICIENT_EVIDENCE
    authority:
      diagnostic: true
      may_score: true
      may_adjust_exposure: true
      may_hard_eliminate: false

  - expert_id: XTRA_SORTED_SLOT_DENSITY
    stage: candidate_funnel
    architecture_status: shadow
    evidence: INSUFFICIENT_EVIDENCE
    authority:
      diagnostic: true
      may_score: true
      may_adjust_exposure: true
      may_hard_eliminate: false

  - expert_id: XTRA_GPR8
    stage: candidate_funnel
    architecture_status: experimental
    evidence: INSUFFICIENT_EVIDENCE
    authority:
      diagnostic: true
      may_score: true
      may_hard_eliminate: false

  - expert_id: XTRA_RICHARDSON_PAIR_DISPERSION
    name: Richardson Residual Pair-Dispersion Shadow
    stage: candidate_funnel
    architecture_status: shadow
    evidence: PROVISIONAL_SIGNAL
    dependencies: [XTRA_HLR_FULL_MIXTURE_BASE]
    authority:
      diagnostic: true
      may_score: true
      may_adjust_exposure: false
      may_hard_eliminate: false
      may_add_candidates: false
      may_remove_candidates: false
      may_prune_candidates: false
    data_boundary:
      active_start: 2026-06-02
      allow_pre_start_history: false
      allow_main_state_transfer: false
    parameters:
      h: 5.0
      kappa: 8.0
      e0018_blend: 0.5
    evidence_paths:
      - core/xtra_richardson_pair_dispersion.md
      - experiments/E0016/findings.md
      - experiments/E0016/decision.md
      - experiments/E0018/protocol.yaml
      - knowledge/PHYSICS_SHADOW_INTEGRATION_HANDOFF_2026-08-28.md
    notes:
      - Models all ten sorted-slot pair separations using XTRA-only expanding history.
      - Residualizes against exact 5/50 pair-separation geometry before message passing.
      - From 2026-09-01, E0018 Richardson must receive the full-support HLR mixture base, never one preferred HLR scenario.
      - E0018 scores base, Richardson and 50/50 blend at identical K13/K20 exposure.
      - Production weight remains zero.
      - Main Richardson state, pair counts, coordinates and weights may not be imported.
    falsification:
      - Demote or reject if prospective fixed-exposure K13/K20/rank lift disappears or is redundant with slot-density/recency/VVD controls.

  - expert_id: XTRA_COALITION_PAIR_OF_PAIRS_ANCHOR
    stage: coalition_assembly
    architecture_status: experimental
    evidence: INSUFFICIENT_EVIDENCE
    authority:
      diagnostic: true
      may_score: true
      may_hard_eliminate: false

  - expert_id: XTRA_MORPH_SLDV
    stage: morphology
    architecture_status: experimental
