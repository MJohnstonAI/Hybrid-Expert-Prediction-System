      may_hard_eliminate: false

  - expert_id: XTRA_RANK_WINNER_FLOAT
    stage: winner_float_ranking
    architecture_status: experimental
    evidence: INSUFFICIENT_EVIDENCE
    authority:
      diagnostic: true
      may_score: true
      may_hard_eliminate: false

  - expert_id: XTRA_PORTFOLIO_CHAOS_BASELINE
    stage: portfolio_optimization
    architecture_status: production
    evidence: BREAKTHROUGH
    authority:
      diagnostic: true
      may_score: false
      may_adjust_exposure: true
      may_hard_eliminate: false
    notes:
      - Breakthrough status is methodological necessity as a control, not predictive superiority.

  - expert_id: XTRA_PB_ACTIVE_MATRIX
    stage: powerball_matrix
    architecture_status: experimental
    evidence: INSUFFICIENT_EVIDENCE
    authority:
      diagnostic: true
      may_score: true
      may_adjust_exposure: true
      may_hard_eliminate: false

  - expert_id: XTRA_PB_CONDITIONAL_CONVERGENCE_E0015
    name: XTRA Conditional PowerBall Residual Convergence
    stage: powerball_matrix
    architecture_status: shadow
    evidence: PROVISIONAL_SIGNAL
    authority:
      diagnostic: true
      may_score: true
      may_adjust_exposure: false
      may_hard_eliminate: false
    evidence_paths:
      - experiments/E0015/hypothesis.md
      - experiments/E0015/protocol.yaml
      - experiments/E0015/findings.md
      - experiments/E0015/decision.md
    notes:
      - Publishes a full 1..16 probability field; score actual-ball rank, log loss and Brier.
      - Uses conditional exact-state and VVD+HLR shrinkage paths.
      - Director hypotheses remain separate zero-weight shadows and are not merged post hoc.
      - Richardson has no XTRA PowerBall authority.

research_moratoria:
  - family: ordinary_historical_spectral_graph_candidate_acquisition
    status: moratorium
    rationale:
      - E0012 no detected acquisition lift.
      - E0014 no XTRA coordinate-acquisition lift from spectral transfer.
      - E0017 claimed spectral success was post-hoc and did not reproduce.
      - E0013 surviving spectral authority is coalition ranking, not candidate acquisition.
    reopen_gate:
      - materially_new_information_or_exogenous_covariate
      - preregistered_matched_K_control
      - declared_minimum_effect_and_power_horizon

governance:
  acquisition_primary_k: 13
  acquisition_diagnostic_k: 20
  expected_hits_k13_under_exchangeable_null: 1.3
  expected_hits_k20_under_exchangeable_null: 2.0
  default_minimum_effect_hits_per_draw_k13: 0.20
  approximate_targets_for_default_effect: 137
  twenty_target_review_is_proof_threshold: false
  expert_vote_multiplier_before_redundancy_audit: false
  power_budget: experiments/E0011/xtra_power_budget.md
  redundancy_protocol: experiments/E0011/xtra_redundancy_protocol.md

data_boundary:
  active_series_start: 2026-06-02
  canonical_ledger: data/powerball_xtra_history.jsonl
  allow_pre_start_history: false
  allow_main_state_transfer: false
  working_state_extensions:
    allowed: true
    canonical_promotion_requires_source_policy: true
    must_be_target_cycle_frozen_and_disclosed: true
