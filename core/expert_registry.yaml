schema_version: 3
updated: 2026-09-05
purpose: >-
  Machine-readable registry of HEPS expert/stage authority. Architecture status means whether a component
  is available in the pipeline; it does NOT imply proven predictive edge. Evidence classification, authority,
  current-method doctrine, and deprecations control interpretation.

binding_interpretation:
  - AGENTS.md
  - governance/current_method_doctrine.md
  - governance/methodology_deprecations.md
  - governance/slot_routed_acquisition_doctrine.md
  - core/feature_dictionary.yaml

architecture_stages:
  - exact_structural_baseline
  - slot_forecast
  - candidate_funnel
  - frozen_k_enumeration
  - candidate_frozen_pattern_constraint_triage
  - coalition_assembly
  - morphology
  - winner_float_ranking
  - portfolio_optimization
  - powerball_matrix

information_families:
  MAIN_SLOT_TRANSITION:
    members:
      - MAIN_SIGNED_SLOT_TRANSITION
      - MAIN_HLR_SLOT
      - MAIN_VVD_DELTA
      - MAIN_TERMINAL_MOTIF
    rule: >-
      These are representations/models of the same sorted-slot transition family and may not be counted
      as independent convergence votes or multiplied as independent likelihood ratios without an explicit coherent dependency model.

  MAIN_WHOLE_LINE_DELTA:
    members:
      - LAST_DIGIT_SUM_ABS_DELTA
      - MAIN_SUM_ABS_DELTA
      - MAIN_SPAN_ABS_DELTA
    rule: >-
      These are completed-line delta summaries. They may be used as separately scored pattern lanes, but E0029 combines
      them only through a robustness/meta-pattern operator. They are not independent likelihood multipliers.

experts:
  - expert_id: MAIN_SIGNED_SLOT_TRANSITION
    name: Joint Signed-Displacement Transition Field
    stage: candidate_funnel
    evidence: INSUFFICIENT_EVIDENCE
    architecture_status: experimental
    information_family: MAIN_SLOT_TRANSITION
    source: experiments/E0021/
    authority:
      diagnostic: true
      may_score: true_after_implementation_and_freeze
      may_adjust_exposure: false
      may_hard_eliminate: false
      may_change_K: false
    notes:
      - Corrected successor research path to E0019 HLRxVVD field.
      - One transition representation per slot; exact legal-line normalization preferred.
      - Proper-score-first gate before K13 recall promotion.

  - expert_id: MAIN_HLR_SLOT
    name: Slot High-Low-Repeat / BARP Direction View
    stage: slot_forecast
    evidence: INSUFFICIENT_EVIDENCE
    architecture_status: experimental
    information_family: MAIN_SLOT_TRANSITION
    independent_vote_authority: false
    mandatory_output_when_enabled: true
    output:
      unit: sorted_slot
      states: [LOW, REPEAT, HIGH]
    authority:
      diagnostic: true
      may_score: true
      may_adjust_exposure: false
      may_hard_eliminate: false
    evidence_paths:
      - experiments/E0005/
      - cycles/2026-09-01/post_draw/main_audit.json
      - cycles/2026-09-04/post_draw/physics_of_failure.md
    notes:
      - Frozen BARP modal LLHHL matched all five realized directions on 2026-09-01.
      - On 2026-09-04 the frozen slotwise modal LHLHH matched 4/5 realized directions; one-target results do not justify retuning.
      - HLR is the sign view of MAIN_SIGNED_SLOT_TRANSITION.

  - expert_id: MAIN_VVD_DELTA
    name: Vertical Variance Delta / VVD-R Diagnostic
    stage: candidate_funnel
    evidence: INSUFFICIENT_EVIDENCE
    architecture_status: experimental
    information_family: MAIN_SLOT_TRANSITION
    independent_vote_authority: false
    authority:
      diagnostic: true
      may_score: true
      may_adjust_exposure: false
      may_hard_eliminate: false
    notes:
      - Absolute magnitude view of signed slot transition.
      - Retain for displacement diagnostics/proper-score comparison only.
      - Do not multiply with HLR or terminal ratios as independent evidence.

  - expert_id: MAIN_TERMINAL_MOTIF
    name: Main Terminal Motif / Symbolic-Dynamics Diagnostic
    stage: slot_forecast
    evidence: INSUFFICIENT_EVIDENCE
    architecture_status: shadow
    information_family: MAIN_SLOT_TRANSITION
    independent_vote_authority: false
    source: experiments/E0020/
    authority:
      diagnostic: true
      may_score: true
      may_adjust_exposure: false
      may_hard_eliminate: false
      may_add_candidates: false
    notes:
      - Terminal diagnostic family retained.
      - E0020 M1-M3 terminalxHLRxVVD multiplicative chain is REJECT for forward acquisition.
      - Terminal/HVR/VVD projections do not become independent votes by being represented separately.

  - expert_id: MAIN_ADJACENT_SLOT_PRESERVATION
    name: Legacy Adjacent-Slot Preservation Challenger
    stage: candidate_funnel
    evidence: INSUFFICIENT_EVIDENCE
    architecture_status: archived
    source: experiments/E0021/
    authority:
      diagnostic: true
      may_score: false
      may_adjust_exposure: false
      may_hard_eliminate: false
      may_change_K: false
    notes:
      - Historical E0021 challenger retained for audit.
      - Forward preservation semantics are superseded by E0026 scenario-constrained slot routing.
      - Unrestricted anywhere-coordinate promotion is not allowed.

  - expert_id: MAIN_SLOT_ROUTED_K13_ACQUISITION
    name: Scenario-Constrained Slot-Routed K13 Acquisition
    stage: candidate_funnel
    evidence: INSUFFICIENT_EVIDENCE
    architecture_status: shadow
    source: experiments/E0026/
    information_family: MAIN_SLOT_TRANSITION
    independent_vote_authority: false
    authority:
      diagnostic: true
      may_score: true_after_pre_draw_freeze
      may_adjust_exposure: true_at_fixed_K13_only
      may_hard_eliminate: false
      may_change_K: false
      may_use_unrestricted_anywhere_collapse: false
    data_boundary:
      active_start: 2026-06-02
      allow_pre_june_2026_history: false
      xtra_state_transfer: false
    required_state:
      - candidate_coordinate
      - admissible_slot_provenance
      - scenario_probability
      - legal_line_support
    notes:
      - HLR/signed-transition uncertainty is a scenario distribution, not one deterministic modal path.
      - Candidate support must remain routed to scenario-compatible legal sorted slots.
      - Adjacent-slot migration is allowed only when supported by a non-negligible pre-draw scenario and legal order-statistic geometry.
      - Fixed K13 only; no union/K-expansion credit.
      - Proper-score improvement of the underlying full-support field remains the first promotion gate.
      - The invalid 27..39 diagnostic slate is preserved as a failure artifact, not an authorized interpretation of E0026.

  - expert_id: LAST_DIGIT_SUM_ABS_DELTA
    name: Last-Digit Sum Absolute Delta / LDSAD
    stage: morphology
    evidence: INSUFFICIENT_EVIDENCE
    architecture_status: shadow
    information_family: MAIN_WHOLE_LINE_DELTA
    source: experiments/E0028/
    authority:
      diagnostic: true
      may_score: true
      may_adjust_exposure: false
      may_hard_eliminate: false
      may_change_K: false
    data_boundary:
      active_start: 2026-06-02
      allow_pre_june_2026_history: false
    notes:
      - Frozen 11..13 band is discovery-derived and receives zero retrospective confirmation credit.
      - 2026-09-04 realized LDSAD=11 was the first fresh target hit; evidence remains INSUFFICIENT_EVIDENCE.
      - No production hard-pruning authority.

  - expert_id: MAIN_PATTERN_OR_TRIAGE
    name: Candidate-Frozen Pattern-OR Triage with Spectral Rescue
    stage: candidate_frozen_pattern_constraint_triage
    evidence: INSUFFICIENT_EVIDENCE
    architecture_status: shadow
    source: experiments/E0029/
    authority:
      diagnostic: true
      may_score: true_after_K13_freeze
      may_adjust_exposure: false
      may_hard_eliminate: false
      may_add_candidates: false
      may_remove_candidates: false
      may_change_K: false
      may_change_powerball: false
    dependencies:
      - frozen_K13
      - enumerate_all_1287_lines
      - MAIN_PPMI_SPECTRAL_COALITION_for_rescue_and_downstream_ranking
    parameters:
      preferred_shadow: MAIN_PATTERN80_SPECTRAL5_RESCUE
      pattern_keep_fraction: 0.80
      spectral_rescue_top_fraction: 0.05
      tie_rule: average_midrank
    notes:
      - Pattern-OR is max(midrank(HLR residual), midrank(LDSAD residual), midrank(SUMAD residual), midrank(SPANAD residual)).
      - It is one robustness/meta-pattern operator, not four independent likelihood votes.
      - Zero K13 authority and zero production hard-pruning authority.
      - On 2026-09-04 the exact winning line could not be scored because four winning coordinates were absent from the frozen official K13 upstream.

  - expert_id: MAIN_PPMI_SPECTRAL_COALITION
    name: Positive-PMI Spectral Coalition Ranking
    stage: coalition_assembly
    evidence: PROVISIONAL_SIGNAL
    architecture_status: shadow
    source: experiments/E0013/
    authority:
      diagnostic: true
      may_score: true
      may_adjust_exposure: false
      may_add_candidates: false
      may_remove_candidates: false
      may_prune_candidates: false
    notes:
      - Coalition-only; zero candidate-discovery authority.
      - Discovery signal is post-search and requires prospective validation.
      - Do not subtract a fictitious coordinate-varying central pair null; future challenger should condition/shrink on observed marginals C_i,C_j.

  - expert_id: MAIN_SLOT1_DECADE_SHELL_ECHO
    name: Slot-1 Anchored Decade-Shell Echo
    stage: coalition_assembly
    evidence: INSUFFICIENT_EVIDENCE
    architecture_status: shadow
    information_family: ORDER_STATISTIC_DECADE_SHELL
    source: experiments/E0023/
    authority:
      diagnostic: true
      may_score: true
      may_adjust_exposure: false
      may_hard_eliminate: false
      may_add_candidates: false
      may_remove_candidates: false
      may_prune_candidates: false
      may_change_K: false
    data_boundary:
      active_start: 2026-06-02
      allow_pre_june_2026_history: false
      xtra_state_transfer: false
    parameters:
      kappa: 20
      decade_bins: ["1-10", "11-20", "21-30", "31-40", "41-50"]
      tie_rule: average_midrank
    notes:
      - Exact-null-residualized P(decade shell | Slot1) diagnostic only.
      - Discovery oracle-K13 mean winner percentile was about 0.531 across 19 targets; no significant lift.
      - Do not add to MAIN_ASSEMBLY_DISSENT_OR until incremental prospective value is demonstrated.
      - No hard decade quotas, candidate changes, or morphology pruning.

